name: CI/CD Pipeline - CloudLite Citas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Etapa Build - Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest flask

      - name: 4. Etapa Test - Ejecutar pruebas unitarias con Pytest
        run: |
          python -m pytest app/test_app.py -v

      - name: 5. Etapa Build Contenedor - Construir imagen Docker
        run: |
          docker build -f contenedores/Dockerfile -t cloudlite-citas:1.0 .

      - name: 6. Etapa Deploy (Simulado) - Publicar y desplegar en PaaS
        run: |
          echo "Autenticando en registro de contenedores..."
          echo "Subiendo imagen cloudlite-citas:1.0 al registro..."
          echo "Desplegando contenedor en entorno PaaS de producción..."
          echo "¡Despliegue completado exitosamente!"
